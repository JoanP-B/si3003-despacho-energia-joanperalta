# Tema del dashboard (se lee al ejecutar `streamlit run` desde la raíz del repositorio).
# Fondo azul marino oscuro, acentos azules y tarjetas blancas (definidas en app.py).
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#172033"
textColor = "#E2E8F0"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
